# LinkedIn Automation Pipeline — Configuration
# Copy to config.yaml and fill in your values

# Command Code settings
command_code:
  max_turns: 3
  trust: true

# Publishing — choose ONE provider
publishing:
  # Providers tried in order. First success wins.
  providers:
    - buffer
    - upload-post

  upload_post:
    api_key: "your-upload-post-api-key"
    api_url: "https://api.upload-post.com/api"
    user: "linkedin"

  buffer:
    access_token: "your-buffer-access-token"
    profile_id: "your-linkedin-profile-id"

# Output
output:
  log_dir: "./logs"
  history_file: "./logs/post_history.json"

# Content preferences
content:
  generate_image: true
  max_chars: 1300
  hashtag_count: 8
  fixed_hashtags:
    - QAAutomation
    - SoftwareTesting
    - AIinTesting
  domains:
    - QA Automation
    - AI in Software Testing
    - Self-healing Test Frameworks
    - API Testing with LLMs
    - Career Growth in QA
    - Flaky Test Detection
    - Test Data Generation
    - Observability-Driven Testing
    - Prompt Engineering for QA
    - Security Testing and AI

# Image generation via Cloudflare Workers API
image_generation:
  api_url: "https://image-create.anikapruwan.workers.dev"
  api_key: "your-api-key"  # Set in config.local.yaml
  output_dir: "./images"

# Image hosting — makes generated images publicly accessible for Buffer
image_hosting:
  provider: "imgbb"  # or "custom"
  api_key: "your-imgbb-api-key"  # Set in config.local.yaml; get one free at https://api.imgbb.com
  # For custom provider:
  # upload_url: "https://your-upload-endpoint.com/upload"
  # url_field: "url"
